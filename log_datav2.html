<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keretapi Tanah Melayu Berhad</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<style>
  :root{
    --ktm-blue:#0b4f8a;
    --ktm-blue-dark:#083b68;
    --ktm-blue-light:#e8f1f9;
    --ktm-red:#c0392b;
    --ktm-green:#1e8e3e;
    --bg:#f2f4f7;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .content-body{padding:24px;max-width:1200px;margin:0 auto;}

  .card{border:none;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;}
  .card-header{background:var(--ktm-blue);color:#fff;padding:20px 24px;}
  .card-header img{max-height:44px;background:#fff;border-radius:6px;padding:4px;}
  .card-header h4{margin:0;font-weight:600;}
  .card-header hr{display:none;}

  .card-body{display:flex;gap:24px;padding:24px;align-items:flex-start;flex-wrap:wrap;}

  .card-navi{width:200px;background:#fff;padding:12px;border:1px solid #e3e6ea;border-radius:10px;flex-shrink:0;}
  .card-navi a{display:block;color:#243447;padding:10px 12px;text-decoration:none;font-size:15px;
    border-radius:8px;transition:background-color .2s,color .2s;font-weight:500;margin-bottom:4px;}
  .card-navi a:hover, .card-navi a.active{background:var(--ktm-blue);color:#fff;}

  .main-panel{flex:1;min-width:280px;width:100%;}

  .panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .panel-heading h5{margin:0;font-weight:700;color:#212b36;}
  .panel-heading p{margin:2px 0 0;font-size:13px;color:#8792a0;}

  .btn-refresh{
    background:#fff;border:1px solid #d7dce2;color:#354150;font-size:13px;font-weight:600;
    padding:8px 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-refresh:hover:not(:disabled){background:#f4f6f8;}
  .btn-refresh:disabled{opacity:.6;cursor:not-allowed;}
  .btn-refresh.spinning svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Tabs */
  .tabs{display:flex;gap:6px;background:#fff;border:1px solid #e3e6ea;border-radius:10px;padding:5px;margin-bottom:18px;width:fit-content;}
  .tab-btn{border:none;background:transparent;padding:9px 18px;border-radius:7px;font-size:13.5px;
    font-weight:600;color:#6b7785;cursor:pointer;transition:background-color .15s,color .15s;}
  .tab-btn.active{background:var(--ktm-blue);color:#fff;}
  .tab-btn:hover:not(.active){background:#f2f4f7;}

  /* Table */
  .table-wrap{background:#fff;border:1px solid #e3e6ea;border-radius:12px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    background:#f8f9fb;text-align:left;padding:12px 16px;font-size:11.5px;letter-spacing:.04em;
    text-transform:uppercase;color:#8792a0;font-weight:700;border-bottom:1px solid #e3e6ea;white-space:nowrap;
  }
  tbody td{padding:13px 16px;border-bottom:1px solid #f0f2f5;color:#354150;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfc;}
  .badge-newest{
    background:var(--ktm-blue);color:#fff;font-size:10px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;padding:3px 8px;border-radius:20px;margin-left:8px;
  }
  .cell-date{font-weight:700;color:#212b36;white-space:nowrap;}
  .cell-muted{color:#8792a0;}

  .btn-view{
    background:var(--ktm-blue-light);color:var(--ktm-blue);border:none;padding:6px 14px;
    border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .btn-view:hover{background:#d5e5f3;}

  /* Pagination */
  .pagination-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border-top:1px solid #e3e6ea;flex-wrap:wrap;gap:10px;}
  .page-info{font-size:13px;color:#8792a0;}
  .page-controls{display:flex;gap:6px;align-items:center;}
  .page-btn{
    border:1px solid #d7dce2;background:#fff;color:#354150;font-size:13px;font-weight:600;
    padding:6px 12px;border-radius:7px;cursor:pointer;min-width:36px;
  }
  .page-btn:hover:not(:disabled){background:#f4f6f8;}
  .page-btn.active{background:var(--ktm-blue);border-color:var(--ktm-blue);color:#fff;}
  .page-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* Loading / error / empty */
  .skeleton{padding:20px;}
  .skel-line{height:16px;border-radius:6px;background:linear-gradient(90deg,#eef1f4 25%,#e4e8ec 37%,#eef1f4 63%);
    background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;margin-bottom:12px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .state-box{padding:36px 22px;text-align:center;}
  .state-box .state-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;margin:0 auto 12px;font-size:20px;color:#fff;}
  .state-icon.error{background:var(--ktm-red);}
  .state-box p{margin:0 0 14px;font-size:14px;color:#6b7785;}
  .state-box.error-state p{color:#7a3b34;}
  .btn-retry-inline{background:var(--ktm-red);color:#fff;border:none;padding:8px 18px;border-radius:8px;
    font-weight:600;font-size:13px;cursor:pointer;}
  .btn-retry-inline:hover{background:#a5332a;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,26,33,.5);display:none;
    align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:85vh;
    overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2);animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-top{background:var(--ktm-blue-light);padding:18px 22px;display:flex;align-items:center;
    justify-content:space-between;position:sticky;top:0;}
  .modal-top .modal-date{font-size:16px;font-weight:700;color:#212b36;}
  .modal-top .modal-close{background:none;border:none;font-size:20px;color:#5c6a7a;cursor:pointer;
    width:32px;height:32px;border-radius:8px;}
  .modal-top .modal-close:hover{background:rgba(11,79,138,.1);}
  .modal-body{padding:6px 22px 20px;}
  .group-title{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ktm-blue);
    font-weight:700;margin:18px 0 4px;padding-bottom:6px;border-bottom:1px solid #eef1f5;}
  .group-title:first-of-type{margin-top:14px;}
  .field-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #f5f6f8;}
  .field-row:last-child{border-bottom:none;}
  .field-row .field-label{font-size:13.5px;color:#6b7785;max-width:60%;}
  .field-row .field-value{font-size:14px;font-weight:600;color:#212b36;text-align:right;word-break:break-word;}
  .field-row .field-value.empty{color:#b0b8c1;font-weight:400;font-style:italic;}

  @media (max-width:768px){
    .card-body{flex-direction:column;}
    .card-navi{width:100%;display:flex;gap:6px;overflow-x:auto;}
    .card-navi a{white-space:nowrap;margin-bottom:0;}
    .table-wrap{overflow-x:auto;}
    table{min-width:520px;}
  }
</style>
</head>
<body>
  <div class="content-body">
    <div class="card">
      <div class="card-header">
        <div class="row align-items-center">
          <div class="col-4 col-md-3">
            <img src="https://www.ktmb.com.my/assets/img/logo_miniktm.png" alt="KTM Logo">
          </div>
          <div class="col-8 col-md-9">
            <h4>Keretapi Tanah Melayu Berhad</h4>
          </div>
        </div>
      </div>

      <div class="card-body">
        <div class="card-navi">
          <a href="index.html">Home</a>
          <a href="server.html">Server</a>
          <a href="log_data.html" class="active">Log Data</a>
        </div>

        <div class="main-panel">
          <div class="panel-heading">
            <div>
              <h5>All Submissions</h5>
              <p id="statusText">Loading…</p>
            </div>
            <button class="btn-refresh" id="refreshBtn" onclick="loadCurrentTab(true)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              Refresh
            </button>
          </div>

          <div class="tabs">
            <button class="tab-btn active" id="tab-spot" onclick="switchTab('spot')">SPOT Interface Batch</button>
            <button class="tab-btn" id="tab-finance" onclick="switchTab('finance')">Finance Interface Batch</button>
          </div>

          <div id="content"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
      <div class="modal-top">
        <span class="modal-date" id="modalDate"></span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7UloeZb2pIGS6TvyC1mlvgHk3m7BnrOCrvkS6c8RWj8lIR4R9CyboAKV4ruVvD-NsGg/exec';
    const PAGE_SIZE = 10;

    // Column config per sheet: [rowIndex, columnHeaderLabel]
    const CONFIG = {
      spot: {
        title: 'SPOT Interface Batch',
        summaryCols: [
          { idx: 1, label: 'Invoice Interface' },
          { idx: 6, label: 'Populate Commuter' },
          { idx: 15, label: 'Created By' }
        ],
        groups: [
          {
            title: '01 – SPOT Interface Batch Programs',
            fields: [[1,'01 – Invoice Interface'],[2,'02 – Receipt Interface'],[3,'03 – Customer Interface']]
          },
          {
            title: '02 – SPOT General Batch Programs',
            fields: [[4,'03 – Generate Daily Timetable'],[5,'06 – Calculate Demurage'],[6,'07 – Populate Commuter Train']]
          },
          {
            title: '03 – SPOT Report Batch Programs',
            fields: [
              [7,'03 – Revenue per Net Ton KM (Freight Train)'],
              [8,'04 – Net Ton, Ton-KM by Commodity (Freight Train)'],
              [9,'06 – Revenue for Freight Train'],
              [10,'07 – Periodical Freight Stats'],
              [11,'08 – Punctuality Data'],
              [12,'09 – Locomotive Statistic'],
              [13,'11 – Train Equipment Tracking'],
              [14,'13 – Turnaround Statistic']
            ]
          }
        ]
      },
      finance: {
        title: 'Finance Interface Batch',
        summaryCols: [
          { idx: 1, label: 'Update Customer' },
          { idx: 5, label: 'Customer Interface' },
          { idx: 6, label: 'Created By' }
        ],
        groups: [
          {
            title: 'Finance Oracle Batch Interface (10.0.150.100)',
            fields: [
              [1,'07 – Update Customer Contact Details'],
              [2,'08 – Update Natural Account Code'],
              [3,'09 – Update Cost Center Code'],
              [4,'10 – Update Exchange Rate']
            ]
          },
          {
            title: 'Spot Interface (10.0.150.103)',
            fields: [[5,'03 – Customer Interface']]
          }
        ]
      }
    };

    let currentSheet = 'spot';
    let currentPage = 1;
    const cache = { spot: null, finance: null };

    const contentEl = document.getElementById('content');
    const statusEl = document.getElementById('statusText');
    const refreshBtn = document.getElementById('refreshBtn');

    function switchTab(sheet) {
      currentSheet = sheet;
      currentPage = 1;
      document.getElementById('tab-spot').classList.toggle('active', sheet === 'spot');
      document.getElementById('tab-finance').classList.toggle('active', sheet === 'finance');
      loadCurrentTab(false);
    }

    function formatDate(rawDate) {
      const d = new Date(rawDate);
      if (isNaN(d.getTime())) return String(rawDate);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function renderLoading() {
      contentEl.innerHTML = `
        <div class="table-wrap"><div class="skeleton">
          <div class="skel-line" style="width:100%"></div>
          <div class="skel-line" style="width:95%"></div>
          <div class="skel-line" style="width:100%"></div>
          <div class="skel-line" style="width:90%"></div>
          <div class="skel-line" style="width:97%"></div>
        </div></div>`;
      statusEl.textContent = 'Loading…';
    }

    function renderError(message) {
      contentEl.innerHTML = `
        <div class="table-wrap"><div class="state-box error-state">
          <div class="state-icon error">✕</div>
          <p>${message}</p>
          <button class="btn-retry-inline" onclick="loadCurrentTab(true)">Try again</button>
        </div></div>`;
      statusEl.textContent = 'Failed to load data';
    }

    function renderEmpty() {
      contentEl.innerHTML = `<div class="table-wrap"><div class="state-box"><p>No submissions found yet.</p></div></div>`;
      statusEl.textContent = 'No data';
    }

    async function loadCurrentTab(forceRefresh) {
      if (!forceRefresh && cache[currentSheet]) {
        renderTable();
        return;
      }

      renderLoading();
      refreshBtn.disabled = true;
      refreshBtn.classList.add('spinning');

      try {
        const response = await fetch(SCRIPT_URL + '?sheet=' + currentSheet);
        if (!response.ok) throw new Error('Server responded with status ' + response.status);

        const data = await response.json();

        if (data && !Array.isArray(data) && data.status === 'error') {
          throw new Error(data.message || 'Server returned an error.');
        }
        if (!Array.isArray(data) || data.length === 0) {
          cache[currentSheet] = [];
          renderEmpty();
          return;
        }

        // Skip header row(s) where col 0 isn't a parseable date
        const rows = data.filter(row => !isNaN(new Date(row[0]).getTime()));
        const sorted = rows.slice().sort((a, b) => new Date(b[0]) - new Date(a[0]));

        cache[currentSheet] = sorted;

        if (sorted.length === 0) {
          renderEmpty();
          return;
        }

        renderTable();

      } catch (err) {
        console.error(err);
        renderError('Could not load the data. Please check your connection and try again.');
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.classList.remove('spinning');
      }
    }

    function renderTable() {
      const rows = cache[currentSheet] || [];
      const config = CONFIG[currentSheet];
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      currentPage = Math.min(currentPage, totalPages);

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageRows = rows.slice(start, start + PAGE_SIZE);

      const headerCells = config.summaryCols.map(c => `<th>${c.label}</th>`).join('');

      const bodyRows = pageRows.map((row, i) => {
        const globalIndex = start + i;
        const cells = config.summaryCols.map(c => {
          const val = row[c.idx];
          const hasValue = val !== undefined && val !== null && String(val).trim() !== '';
          return `<td class="${hasValue ? '' : 'cell-muted'}">${hasValue ? val : '—'}</td>`;
        }).join('');

        return `
          <tr>
            <td class="cell-date">${formatDate(row[0])}${globalIndex === 0 ? '<span class="badge-newest">Latest</span>' : ''}</td>
            ${cells}
            <td><button class="btn-view" onclick="viewRow(${globalIndex})">View</button></td>
          </tr>`;
      }).join('');

      const pageButtons = buildPageButtons(currentPage, totalPages);

      contentEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th>${headerCells}<th></th></tr></thead>
            <tbody>${bodyRows}</tbody>
          </table>
          <div class="pagination-bar">
            <span class="page-info">Showing ${start + 1}–${Math.min(start + PAGE_SIZE, rows.length)} of ${rows.length}</span>
            <div class="page-controls">${pageButtons}</div>
          </div>
        </div>`;

      statusEl.textContent = `${rows.length} submission${rows.length === 1 ? '' : 's'} · ${config.title}`;
    }

    function buildPageButtons(page, totalPages) {
      let html = `<button class="page-btn" ${page === 1 ? 'disabled' : ''} onclick="goToPage(${page - 1})">‹</button>`;
      for (let p = 1; p <= totalPages; p++) {
        if (totalPages > 7 && p !== 1 && p !== totalPages && Math.abs(p - page) > 1) {
          if (p === 2 || p === totalPages - 1) html += `<span class="page-info">…</span>`;
          continue;
        }
        html += `<button class="page-btn ${p === page ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
      }
      html += `<button class="page-btn" ${page === totalPages ? 'disabled' : ''} onclick="goToPage(${page + 1})">›</button>`;
      return html;
    }

    function goToPage(p) {
      currentPage = p;
      renderTable();
    }

    function viewRow(globalIndex) {
      const row = cache[currentSheet][globalIndex];
      const config = CONFIG[currentSheet];

      document.getElementById('modalDate').textContent = formatDate(row[0]);

      const groupsHtml = config.groups.map(group => {
        const rowsHtml = group.fields.map(([idx, label]) => {
          const value = row[idx];
          const hasValue = value !== undefined && value !== null && String(value).trim() !== '';
          return `
            <div class="field-row">
              <div class="field-label">${label}</div>
              <div class="field-value ${hasValue ? '' : 'empty'}">${hasValue ? value : '—'}</div>
            </div>`;
        }).join('');
        return `<div class="group-title">${group.title}</div>${rowsHtml}`;
      }).join('');

      document.getElementById('modalBody').innerHTML = groupsHtml;
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    loadCurrentTab(false);
  </script>
</body>
</html>
