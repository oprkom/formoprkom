<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keretapi Tanah Melayu Berhad</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<style>
  :root{
    --ktm-blue:#0b4f8a;
    --ktm-blue-dark:#083b68;
    --ktm-blue-light:#e8f1f9;
    --ktm-red:#c0392b;
    --ktm-red-light:#fdf1ef;
    --ktm-green:#1e8e3e;
    --bg:#f2f4f7;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .content-body{padding:24px;max-width:1200px;margin:0 auto;}

  .card{border:none;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;}
  .card-header{background:var(--ktm-blue);color:#fff;padding:20px 24px;}
  .card-header img{max-height:44px;background:#fff;border-radius:6px;padding:4px;}
  .card-header h4{margin:0;font-weight:600;}
  .card-header hr{display:none;}

  .card-body{display:flex;gap:24px;padding:24px;align-items:flex-start;flex-wrap:wrap;}

  .card-navi{width:200px;background:#fff;padding:12px;border:1px solid #e3e6ea;border-radius:10px;flex-shrink:0;}
  .card-navi a{display:block;color:#243447;padding:10px 12px;text-decoration:none;font-size:15px;
    border-radius:8px;transition:background-color .2s,color .2s;font-weight:500;margin-bottom:4px;}
  .card-navi a:hover, .card-navi a.active{background:var(--ktm-blue);color:#fff;}

  .main-panel{flex:1;min-width:280px;width:100%;}

  .panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .panel-heading h5{margin:0;font-weight:700;color:#212b36;}
  .panel-heading p{margin:2px 0 0;font-size:13px;color:#8792a0;}

  .btn-refresh{
    background:#fff;border:1px solid #d7dce2;color:#354150;font-size:13px;font-weight:600;
    padding:8px 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-refresh:hover:not(:disabled){background:#f4f6f8;}
  .btn-refresh:disabled{opacity:.6;cursor:not-allowed;}
  .btn-refresh.spinning svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Toast */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:#212b36;color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:1200;opacity:0;transition:opacity .2s,transform .2s;
    display:flex;align-items:center;gap:8px;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.success{background:var(--ktm-green);}
  .toast.error{background:var(--ktm-red);}

  /* Tabs */
  .tabs{display:flex;gap:6px;background:#fff;border:1px solid #e3e6ea;border-radius:10px;padding:5px;margin-bottom:18px;width:fit-content;}
  .tab-btn{border:none;background:transparent;padding:9px 18px;border-radius:7px;font-size:13.5px;
    font-weight:600;color:#6b7785;cursor:pointer;transition:background-color .15s,color .15s;}
  .tab-btn.active{background:var(--ktm-blue);color:#fff;}
  .tab-btn:hover:not(.active){background:#f2f4f7;}

  /* Table */
  .table-wrap{background:#fff;border:1px solid #e3e6ea;border-radius:12px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    background:#f8f9fb;text-align:left;padding:12px 16px;font-size:11.5px;letter-spacing:.04em;
    text-transform:uppercase;color:#8792a0;font-weight:700;border-bottom:1px solid #e3e6ea;white-space:nowrap;
  }
  tbody td{padding:13px 16px;border-bottom:1px solid #f0f2f5;color:#354150;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfc;}
  .badge-newest{
    background:var(--ktm-blue);color:#fff;font-size:10px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;padding:3px 8px;border-radius:20px;margin-left:8px;
  }
  .cell-date{font-weight:700;color:#212b36;white-space:nowrap;}
  .cell-muted{color:#8792a0;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}

  .btn-icon{
    border:none;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .btn-view{background:var(--ktm-blue-light);color:var(--ktm-blue);}
  .btn-view:hover{background:#d5e5f3;}
  .btn-edit{background:#fbf1e3;color:#b6791b;}
  .btn-edit:hover{background:#f6e4c6;}
  .btn-delete{background:var(--ktm-red-light);color:var(--ktm-red);}
  .btn-delete:hover{background:#f9dcd6;}
  .btn-icon:disabled{opacity:.5;cursor:not-allowed;}

  /* Pagination */
  .pagination-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border-top:1px solid #e3e6ea;flex-wrap:wrap;gap:10px;}
  .page-info{font-size:13px;color:#8792a0;}
  .page-controls{display:flex;gap:6px;align-items:center;}
  .page-btn{
    border:1px solid #d7dce2;background:#fff;color:#354150;font-size:13px;font-weight:600;
    padding:6px 12px;border-radius:7px;cursor:pointer;min-width:36px;
  }
  .page-btn:hover:not(:disabled){background:#f4f6f8;}
  .page-btn.active{background:var(--ktm-blue);border-color:var(--ktm-blue);color:#fff;}
  .page-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* Loading / error / empty */
  .skeleton{padding:20px;}
  .skel-line{height:16px;border-radius:6px;background:linear-gradient(90deg,#eef1f4 25%,#e4e8ec 37%,#eef1f4 63%);
    background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;margin-bottom:12px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .state-box{padding:36px 22px;text-align:center;}
  .state-box .state-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;margin:0 auto 12px;font-size:20px;color:#fff;}
  .state-icon.error{background:var(--ktm-red);}
  .state-box p{margin:0 0 14px;font-size:14px;color:#6b7785;}
  .state-box.error-state p{color:#7a3b34;}
  .btn-retry-inline{background:var(--ktm-red);color:#fff;border:none;padding:8px 18px;border-radius:8px;
    font-weight:600;font-size:13px;cursor:pointer;}
  .btn-retry-inline:hover{background:#a5332a;}

  /* Modal (view / edit) */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,26,33,.5);display:none;
    align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:85vh;
    overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2);animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-top{background:var(--ktm-blue-light);padding:18px 22px;display:flex;align-items:center;
    justify-content:space-between;position:sticky;top:0;gap:10px;}
  .modal-top.edit-mode{background:#fbf1e3;}
  .modal-top .modal-date{font-size:16px;font-weight:700;color:#212b36;}
  .modal-top .modal-close{background:none;border:none;font-size:20px;color:#5c6a7a;cursor:pointer;
    width:32px;height:32px;border-radius:8px;flex-shrink:0;}
  .modal-top .modal-close:hover{background:rgba(0,0,0,.08);}
  .modal-body{padding:6px 22px 20px;}
  .group-title{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ktm-blue);
    font-weight:700;margin:18px 0 4px;padding-bottom:6px;border-bottom:1px solid #eef1f5;}
  .group-title:first-of-type{margin-top:14px;}
  .field-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #f5f6f8;align-items:center;}
  .field-row:last-child{border-bottom:none;}
  .field-row .field-label{font-size:13.5px;color:#6b7785;max-width:55%;}
  .field-row .field-value{font-size:14px;font-weight:600;color:#212b36;text-align:right;word-break:break-word;}
  .field-row .field-value.empty{color:#b0b8c1;font-weight:400;font-style:italic;}
  .field-row input{
    flex:1;max-width:60%;padding:7px 10px;border:1px solid #d7dce2;border-radius:7px;font-size:13.5px;
    text-align:right;color:#212b36;
  }
  .field-row input:focus{outline:none;border-color:var(--ktm-blue);box-shadow:0 0 0 .15rem rgba(11,79,138,.15);}

  .modal-footer{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid #f0f2f5;}
  .modal-footer button{border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:13.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;}
  .btn-save{background:var(--ktm-blue);color:#fff;}
  .btn-save:hover:not(:disabled){background:var(--ktm-blue-dark);}
  .btn-save:disabled{background:#9fb3c8;cursor:not-allowed;}
  .btn-cancel{background:#eef1f4;color:#354150;}
  .btn-cancel:hover{background:#e0e5eb;}
  .btn-edit-open{background:#fbf1e3;color:#b6791b;}
  .btn-edit-open:hover{background:#f6e4c6;}
  .btn-delete-open{background:var(--ktm-red-light);color:var(--ktm-red);}
  .btn-delete-open:hover{background:#f9dcd6;}
  .spinner-sm{width:13px;height:13px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;
    border-radius:50%;animation:spin .7s linear infinite;}

  /* Confirm delete modal */
  .confirm-box{max-width:360px;text-align:center;padding:28px 24px;}
  .confirm-box .confirm-icon{width:48px;height:48px;border-radius:50%;background:var(--ktm-red);color:#fff;
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:20px;}
  .confirm-box h6{margin:0 0 6px;font-weight:700;color:#212b36;font-size:16px;}
  .confirm-box p{margin:0 0 20px;font-size:13.5px;color:#6b7785;}
  .confirm-box .confirm-btns{display:flex;gap:10px;justify-content:center;}

  @media (max-width:768px){
    .card-body{flex-direction:column;}
    .card-navi{width:100%;display:flex;gap:6px;overflow-x:auto;}
    .card-navi a{white-space:nowrap;margin-bottom:0;}
    .table-wrap{overflow-x:auto;}
    table{min-width:560px;}
  }
</style>
</head>
<body>
  <div class="content-body">
    <div class="card">
      <div class="card-header">
        <div class="row align-items-center">
          <div class="col-4 col-md-3">
            <img src="https://www.ktmb.com.my/assets/img/logo_miniktm.png" alt="KTM Logo">
          </div>
          <div class="col-8 col-md-9">
            <h4>Keretapi Tanah Melayu Berhad</h4>
          </div>
        </div>
      </div>

      <div class="card-body">
        <div class="card-navi">
          <a href="index.html">Home</a>
          <a href="server.html">Server</a>
          <a href="log_data.html" class="active">Log Data</a>
        </div>

        <div class="main-panel">
          <div class="panel-heading">
            <div>
              <h5>All Submissions</h5>
              <p id="statusText">Loading…</p>
            </div>
            <button class="btn-refresh" id="refreshBtn" onclick="loadCurrentTab(true)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              Refresh
            </button>
          </div>

          <div class="tabs">
            <button class="tab-btn active" id="tab-spot" onclick="switchTab('spot')">SPOT Interface Batch</button>
            <button class="tab-btn" id="tab-finance" onclick="switchTab('finance')">Finance Interface Batch</button>
          </div>

          <div id="content"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- View / Edit modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this && !isSaving) closeModal()">
    <div class="modal-box">
      <div class="modal-top" id="modalTop">
        <span class="modal-date" id="modalDate"></span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="confirmOverlay">
    <div class="modal-box confirm-box">
      <div class="confirm-icon">✕</div>
      <h6>Delete this submission?</h6>
      <p id="confirmDate"></p>
      <div class="confirm-btns">
        <button class="btn-cancel" style="border:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;" onclick="closeConfirm()">Cancel</button>
        <button class="btn-save" id="confirmDeleteBtn" style="background:var(--ktm-red);border:none;border-radius:8px;padding:10px 18px;font-weight:600;color:#fff;cursor:pointer;" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwp9iMRY4Nh9nJqFVtZ9SHhUjBOH06iTuSjrgSmA2PxTsCnqEcPtc1WynW4gS5FLJeumw/exec';
    const PAGE_SIZE = 10;

    // Column config per sheet.
    // fieldKeys[idx] gives the field name expected by the backend for that row index.
    const CONFIG = {
      spot: {
        title: 'SPOT Interface Batch',
        sheetParam: 'spot',
        fieldKeys: ['date','invoice_interface','receipt_interface','customer_interface',
          'generate_daily','calculate_demurage','populate_commuter','revenue_net','net_ton',
          'revenue_freight','perodial_freight','punctually_data','locomotive_statistic',
          'train_equipment','turnaround_statistic','no_staff'],
        summaryCols: [
          { idx: 1, label: 'Invoice Interface' },
          { idx: 6, label: 'Populate Commuter' },
          { idx: 15, label: 'Created By' }
        ],
        groups: [
          {
            title: '01 – SPOT Interface Batch Programs',
            fields: [[1,'01 – Invoice Interface'],[2,'02 – Receipt Interface'],[3,'03 – Customer Interface']]
          },
          {
            title: '02 – SPOT General Batch Programs',
            fields: [[4,'03 – Generate Daily Timetable'],[5,'06 – Calculate Demurage'],[6,'07 – Populate Commuter Train']]
          },
          {
            title: '03 – SPOT Report Batch Programs',
            fields: [
              [7,'03 – Revenue per Net Ton KM (Freight Train)'],
              [8,'04 – Net Ton, Ton-KM by Commodity (Freight Train)'],
              [9,'06 – Revenue for Freight Train'],
              [10,'07 – Periodical Freight Stats'],
              [11,'08 – Punctuality Data'],
              [12,'09 – Locomotive Statistic'],
              [13,'11 – Train Equipment Tracking'],
              [14,'13 – Turnaround Statistic']
            ]
          },
          {
            title: 'Meta',
            fields: [[15,'Created By']]
          }
        ]
      },
      finance: {
        title: 'Finance Interface Batch',
        sheetParam: 'finance',
        fieldKeys: ['date','update_customer','update_natural','update_cost','update_exchange','customer_data','no_staff'],
        summaryCols: [
          { idx: 1, label: 'Update Customer' },
          { idx: 5, label: 'Customer Interface' },
          { idx: 6, label: 'Created By' }
        ],
        groups: [
          {
            title: 'Finance Oracle Batch Interface (10.0.150.100)',
            fields: [
              [1,'07 – Update Customer Contact Details'],
              [2,'08 – Update Natural Account Code'],
              [3,'09 – Update Cost Center Code'],
              [4,'10 – Update Exchange Rate']
            ]
          },
          {
            title: 'Spot Interface (10.0.150.103)',
            fields: [[5,'03 – Customer Interface']]
          },
          {
            title: 'Meta',
            fields: [[6,'Created By']]
          }
        ]
      }
    };

    const STAFF_OPTIONS = [
      { value: '', label: '--' },
      { value: '002299', label: 'AZIZAN ABAS' },
      { value: '002244', label: 'SHAHARUDDIN SHAID' },
      { value: '301009', label: 'MUHAMMAD HAFIZUL HAKIM' },
      { value: '301026', label: 'AHMAD FADZELII' },
      { value: '303547', label: 'HAZWAN' },
      { value: '302289', label: 'AMIRUL SHAFIQ' },
      { value: '304504', label: 'MUHAMMAD AZHAR' },
      { value: '303230', label: 'AMIRUL AZRI' },
      { value: '303229', label: 'MOHAMAD FADZLI' }
    ];

    let currentSheet = 'spot';
    let currentPage = 1;
    let isSaving = false;
    let modalMode = 'view'; // 'view' | 'edit'
    let activeGlobalIndex = null;
    let pendingDeleteIndex = null;
    const cache = { spot: null, finance: null }; // arrays of {rowNumber, values}

    const contentEl = document.getElementById('content');
    const statusEl = document.getElementById('statusText');
    const refreshBtn = document.getElementById('refreshBtn');

    // ---------- Tabs & data loading ----------

    function switchTab(sheet) {
      currentSheet = sheet;
      currentPage = 1;
      document.getElementById('tab-spot').classList.toggle('active', sheet === 'spot');
      document.getElementById('tab-finance').classList.toggle('active', sheet === 'finance');
      loadCurrentTab(false);
    }

    const SHEET_TIMEZONE = 'Asia/Kuala_Lumpur';

    function formatDate(rawDate) {
      const d = new Date(rawDate);
      if (isNaN(d.getTime())) return String(rawDate);
      // Force display in the spreadsheet's timezone so the calendar day is
      // never off by one for viewers in a different timezone than KL.
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', timeZone: SHEET_TIMEZONE });
    }

    function toInputDate(rawDate) {
      const d = new Date(rawDate);
      if (isNaN(d.getTime())) return '';
      // en-CA locale gives YYYY-MM-DD directly, computed in KL time.
      return d.toLocaleDateString('en-CA', { timeZone: SHEET_TIMEZONE });
    }

    function staffLabel(code) {
      const match = STAFF_OPTIONS.find(opt => opt.value === String(code));
      return match ? match.label : code;
    }

    function renderLoading() {
      contentEl.innerHTML = `
        <div class="table-wrap"><div class="skeleton">
          <div class="skel-line" style="width:100%"></div>
          <div class="skel-line" style="width:95%"></div>
          <div class="skel-line" style="width:100%"></div>
          <div class="skel-line" style="width:90%"></div>
          <div class="skel-line" style="width:97%"></div>
        </div></div>`;
      statusEl.textContent = 'Loading…';
    }

    function renderError(message) {
      contentEl.innerHTML = `
        <div class="table-wrap"><div class="state-box error-state">
          <div class="state-icon error">✕</div>
          <p>${message}</p>
          <button class="btn-retry-inline" onclick="loadCurrentTab(true)">Try again</button>
        </div></div>`;
      statusEl.textContent = 'Failed to load data';
    }

    function renderEmpty() {
      contentEl.innerHTML = `<div class="table-wrap"><div class="state-box"><p>No submissions found yet.</p></div></div>`;
      statusEl.textContent = 'No data';
    }

    async function loadCurrentTab(forceRefresh) {
      if (!forceRefresh && cache[currentSheet]) {
        renderTable();
        return;
      }

      renderLoading();
      refreshBtn.disabled = true;
      refreshBtn.classList.add('spinning');

      try {
        const response = await fetch(SCRIPT_URL + '?sheet=' + CONFIG[currentSheet].sheetParam);
        if (!response.ok) throw new Error('Server responded with status ' + response.status);

        const data = await response.json();

        if (data && !Array.isArray(data) && data.status === 'error') {
          throw new Error(data.message || 'Server returned an error.');
        }
        if (!Array.isArray(data) || data.length === 0) {
          cache[currentSheet] = [];
          renderEmpty();
          return;
        }

        // Expect [{rowNumber, values}, ...]. Skip rows where values[0] isn't a parseable date (header row).
        const rows = data.filter(item => item && item.values && !isNaN(new Date(item.values[0]).getTime()));
        const sorted = rows.slice().sort((a, b) => new Date(b.values[0]) - new Date(a.values[0]));

        cache[currentSheet] = sorted;

        if (sorted.length === 0) {
          renderEmpty();
          return;
        }

        renderTable();

      } catch (err) {
        console.error(err);
        renderError('Could not load the data. Please check your connection and try again.');
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.classList.remove('spinning');
      }
    }

    // ---------- Table rendering ----------

    function renderTable() {
      const rows = cache[currentSheet] || [];
      const config = CONFIG[currentSheet];
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      currentPage = Math.min(currentPage, totalPages);

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageRows = rows.slice(start, start + PAGE_SIZE);

      const headerCells = config.summaryCols.map(c => `<th>${c.label}</th>`).join('');

      const bodyRows = pageRows.map((item, i) => {
        const globalIndex = start + i;
        const row = item.values;
        const cells = config.summaryCols.map(c => {
          const val = row[c.idx];
          const hasValue = val !== undefined && val !== null && String(val).trim() !== '';
          const displayVal = (config.fieldKeys[c.idx] === 'no_staff' && hasValue) ? staffLabel(val) : val;
          return `<td class="${hasValue ? '' : 'cell-muted'}">${hasValue ? displayVal : '—'}</td>`;
        }).join('');

        return `
          <tr>
            <td class="cell-date">${formatDate(row[0])}${globalIndex === 0 ? '<span class="badge-newest">Latest</span>' : ''}</td>
            ${cells}
            <td>
              <div class="row-actions">
                <button class="btn-icon btn-view" onclick="openView(${globalIndex})">View</button>
                <button class="btn-icon btn-edit" onclick="openEdit(${globalIndex})">Edit</button>
                <button class="btn-icon btn-delete" onclick="openConfirm(${globalIndex})">Delete</button>
              </div>
            </td>
          </tr>`;
      }).join('');

      const pageButtons = buildPageButtons(currentPage, totalPages);

      contentEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th>${headerCells}<th></th></tr></thead>
            <tbody>${bodyRows}</tbody>
          </table>
          <div class="pagination-bar">
            <span class="page-info">Showing ${start + 1}–${Math.min(start + PAGE_SIZE, rows.length)} of ${rows.length}</span>
            <div class="page-controls">${pageButtons}</div>
          </div>
        </div>`;

      statusEl.textContent = `${rows.length} submission${rows.length === 1 ? '' : 's'} · ${config.title}`;
    }

    function buildPageButtons(page, totalPages) {
      let html = `<button class="page-btn" ${page === 1 ? 'disabled' : ''} onclick="goToPage(${page - 1})">‹</button>`;
      for (let p = 1; p <= totalPages; p++) {
        if (totalPages > 7 && p !== 1 && p !== totalPages && Math.abs(p - page) > 1) {
          if (p === 2 || p === totalPages - 1) html += `<span class="page-info">…</span>`;
          continue;
        }
        html += `<button class="page-btn ${p === page ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
      }
      html += `<button class="page-btn" ${page === totalPages ? 'disabled' : ''} onclick="goToPage(${page + 1})">›</button>`;
      return html;
    }

    function goToPage(p) {
      currentPage = p;
      renderTable();
    }

    // ---------- View / Edit modal ----------

    function openView(globalIndex) {
      activeGlobalIndex = globalIndex;
      modalMode = 'view';
      renderModal();
      document.getElementById('modalOverlay').classList.add('show');
    }

    function openEdit(globalIndex) {
      activeGlobalIndex = globalIndex;
      modalMode = 'edit';
      renderModal();
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal() {
      if (isSaving) return;
      document.getElementById('modalOverlay').classList.remove('show');
      activeGlobalIndex = null;
    }

    function renderModal() {
      const item = cache[currentSheet][activeGlobalIndex];
      const row = item.values;
      const config = CONFIG[currentSheet];
      const isEdit = modalMode === 'edit';

      document.getElementById('modalTop').classList.toggle('edit-mode', isEdit);
      document.getElementById('modalDate').textContent = isEdit ? 'Edit submission' : formatDate(row[0]);

      const groupsHtml = config.groups.map(group => {
        const rowsHtml = group.fields.map(([idx, label]) => {
          const value = row[idx];
          const hasValue = value !== undefined && value !== null && String(value).trim() !== '';
          const isStaffField = config.fieldKeys[idx] === 'no_staff';

          if (!isEdit) {
            const displayValue = isStaffField && hasValue ? staffLabel(value) : value;
            return `
              <div class="field-row">
                <div class="field-label">${label}</div>
                <div class="field-value ${hasValue ? '' : 'empty'}">${hasValue ? displayValue : '—'}</div>
              </div>`;
          }

          if (idx === 0) {
            return `
              <div class="field-row">
                <div class="field-label">${label}</div>
                <input type="date" data-field-idx="${idx}" value="${toInputDate(value)}">
              </div>`;
          }

          if (isStaffField) {
            const optionsHtml = STAFF_OPTIONS.map(opt =>
              `<option value="${opt.value}" ${String(value) === opt.value ? 'selected' : ''}>${opt.label}</option>`
            ).join('');
            return `
              <div class="field-row">
                <div class="field-label">${label}</div>
                <select data-field-idx="${idx}" class="form-control" style="max-width:60%;padding:7px 10px;border:1px solid #d7dce2;border-radius:7px;font-size:13.5px;">
                  ${optionsHtml}
                </select>
              </div>`;
          }

          const escaped = hasValue ? String(value).replace(/"/g, '&quot;') : '';
          return `
            <div class="field-row">
              <div class="field-label">${label}</div>
              <input type="text" data-field-idx="${idx}" value="${escaped}">
            </div>`;
        }).join('');
        return `<div class="group-title">${group.title}</div>${rowsHtml}`;
      }).join('');

      document.getElementById('modalBody').innerHTML = groupsHtml;

      const footer = document.getElementById('modalFooter');
      if (isEdit) {
        footer.innerHTML = `
          <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
          <button class="btn-save" id="saveBtn" onclick="saveEdit()"><span id="saveLabel">Save changes</span></button>`;
      } else {
        footer.innerHTML = `
          <button class="btn-delete-open" onclick="openConfirm(${activeGlobalIndex}); closeModal();">Delete</button>
          <button class="btn-edit-open" onclick="openEdit(${activeGlobalIndex})">Edit</button>`;
      }
    }

    function cancelEdit() {
      modalMode = 'view';
      renderModal();
    }

    async function saveEdit() {
      const config = CONFIG[currentSheet];
      const item = cache[currentSheet][activeGlobalIndex];
      const inputs = document.querySelectorAll('#modalBody [data-field-idx]');

      const newValues = item.values.slice();
      inputs.forEach(inp => {
        const idx = parseInt(inp.getAttribute('data-field-idx'), 10);
        newValues[idx] = inp.value;
      });

      // Build payload keyed by field name, as the backend expects.
      const payload = { action: 'update', sheet: config.sheetParam, rowNumber: item.rowNumber };
      config.fieldKeys.forEach((key, idx) => { payload[key] = newValues[idx]; });

      const missing = config.fieldKeys.filter(k => !payload[k]);
      if (missing.length > 0) {
        showToast('error', 'Please fill in all fields before saving.');
        return;
      }

      isSaving = true;
      const saveBtn = document.getElementById('saveBtn');
      const saveLabel = document.getElementById('saveLabel');
      saveBtn.disabled = true;
      saveLabel.innerHTML = '<span class="spinner-sm"></span> Saving…';

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error('Server responded with status ' + response.status);

        const raw = await response.text();
        const result = JSON.parse(raw);
        if (result.status !== 'success') throw new Error(result.message || 'Update failed.');

        item.values = newValues;
        showToast('success', 'Submission updated.');
        modalMode = 'view';
        renderModal();
        renderTable();

      } catch (err) {
        console.error(err);
        showToast('error', 'Could not save changes: ' + err.message);
      } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveLabel.textContent = 'Save changes';
      }
    }

    // ---------- Delete confirmation ----------

    function openConfirm(globalIndex) {
      pendingDeleteIndex = globalIndex;
      const item = cache[currentSheet][globalIndex];
      document.getElementById('confirmDate').textContent =
        `${formatDate(item.values[0])} — this cannot be undone.`;
      document.getElementById('confirmOverlay').classList.add('show');
    }

    function closeConfirm() {
      pendingDeleteIndex = null;
      document.getElementById('confirmOverlay').classList.remove('show');
    }

    async function confirmDelete() {
      if (pendingDeleteIndex === null) return;
      const config = CONFIG[currentSheet];
      const item = cache[currentSheet][pendingDeleteIndex];
      const btn = document.getElementById('confirmDeleteBtn');
      btn.disabled = true;
      btn.textContent = 'Deleting…';

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', sheet: config.sheetParam, rowNumber: item.rowNumber })
        });
        if (!response.ok) throw new Error('Server responded with status ' + response.status);

        const raw = await response.text();
        const result = JSON.parse(raw);
        if (result.status !== 'success') throw new Error(result.message || 'Delete failed.');

        cache[currentSheet].splice(pendingDeleteIndex, 1);
        showToast('success', 'Submission deleted.');
        closeConfirm();
        closeModal();

        if (cache[currentSheet].length === 0) {
          renderEmpty();
        } else {
          renderTable();
        }

      } catch (err) {
        console.error(err);
        showToast('error', 'Could not delete: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Delete';
      }
    }

    // ---------- Toast ----------

    let toastTimeout = null;
    function showToast(type, message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show ' + type;
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3200);
    }

    loadCurrentTab(false);
  </script>
</body>
</html>
