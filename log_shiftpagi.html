<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keretapi Tanah Melayu Berhad</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<style>
  :root{
    --ktm-blue:#0b4f8a;
    --ktm-blue-dark:#083b68;
    --ktm-blue-light:#e8f1f9;
    --ktm-red:#c0392b;
    --ktm-green:#1e8e3e;
    --bg:#f2f4f7;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .content-body{padding:24px;max-width:1200px;margin:0 auto;}

  .card{border:none;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;}
  .card-header{background:var(--ktm-blue);color:#fff;padding:20px 24px;}
  .card-header img{max-height:44px;background:#fff;border-radius:6px;padding:4px;}
  .card-header h4{margin:0;font-weight:600;}
  .card-header hr{display:none;}

  .card-body{display:flex;gap:24px;padding:24px;align-items:flex-start;flex-wrap:wrap;}

  .card-navi{width:200px;background:#fff;padding:12px;border:1px solid #e3e6ea;border-radius:10px;flex-shrink:0;}
  .card-navi a{display:block;color:#243447;padding:10px 12px;text-decoration:none;font-size:15px;
    border-radius:8px;transition:background-color .2s,color .2s;font-weight:500;margin-bottom:4px;}
  .card-navi a:hover, .card-navi a.active{background:var(--ktm-blue);color:#fff;}

  .main-panel{flex:1;min-width:280px;}

  .panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .panel-heading h5{margin:0;font-weight:700;color:#212b36;}
  .panel-heading p{margin:2px 0 0;font-size:13px;color:#8792a0;}

  .btn-refresh{
    background:#fff;border:1px solid #d7dce2;color:#354150;font-size:13px;font-weight:600;
    padding:8px 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:background-color .15s;
  }
  .btn-refresh:hover:not(:disabled){background:#f4f6f8;}
  .btn-refresh:disabled{opacity:.6;cursor:not-allowed;}
  .btn-refresh.spinning svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Report card */
  .report-card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;overflow:hidden;margin-bottom:20px;}
  .report-card-top{
    background:var(--ktm-blue-light);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:8px;
  }
  .report-card-top .badge-latest{
    background:var(--ktm-blue);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;padding:4px 10px;border-radius:20px;
  }
  .report-card-top .report-date{font-size:15px;font-weight:700;color:#212b36;}
  .report-card-top .report-staff{font-size:12.5px;color:#5c6a7a;}
  .report-card-body{padding:4px 20px 8px;}

  .group-title{
    font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ktm-blue);
    font-weight:700;margin:18px 0 4px;padding-bottom:6px;border-bottom:1px solid #eef1f5;
  }
  .group-title:first-of-type{margin-top:14px;}

  .field-row{
    display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #f5f6f8;
  }
  .field-row:last-child{border-bottom:none;}
  .field-row .field-label{font-size:13.5px;color:#6b7785;flex-shrink:0;max-width:65%;}
  .field-row .field-value{font-size:14px;font-weight:600;color:#212b36;text-align:right;word-break:break-word;}
  .field-row .field-value.empty{color:#b0b8c1;font-weight:400;font-style:italic;}

  /* Loading skeleton */
  .skeleton{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:20px;}
  .skel-line{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef1f4 25%,#e4e8ec 37%,#eef1f4 63%);
    background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;margin-bottom:12px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

  /* Error / empty state */
  .error-box{
    background:#fdf1ef;border:1px solid #f2c6bd;border-radius:12px;padding:22px;text-align:center;
  }
  .error-box.neutral{background:#fff;border-color:#e3e6ea;}
  .error-box .error-icon{
    width:44px;height:44px;border-radius:50%;background:var(--ktm-red);color:#fff;display:flex;
    align-items:center;justify-content:center;margin:0 auto 12px;font-size:20px;
  }
  .error-box p{margin:0 0 14px;color:#7a3b34;font-size:14px;}
  .error-box.neutral p{color:#6b7785;margin-bottom:0;}
  .btn-retry-inline{
    background:var(--ktm-red);color:#fff;border:none;padding:8px 18px;border-radius:8px;
    font-weight:600;font-size:13px;cursor:pointer;
  }
  .btn-retry-inline:hover{background:#a5332a;}

  @media (max-width:768px){
    .card-body{flex-direction:column;}
    .card-navi{width:100%;display:flex;gap:6px;overflow-x:auto;}
    .card-navi a{white-space:nowrap;margin-bottom:0;}
    .field-row{flex-direction:column;gap:2px;}
    .field-row .field-value{text-align:left;}
  }
</style>
</head>
<body>
  <div class="content-body">
    <div class="card">
      <div class="card-header">
        <div class="row align-items-center">
          <div class="col-4 col-md-3">
            <img src="https://www.ktmb.com.my/assets/img/logo_miniktm.png" alt="KTM Logo">
          </div>
          <div class="col-8 col-md-9">
            <h4>Keretapi Tanah Melayu Berhad</h4>
          </div>
        </div>
      </div>

      <div class="card-body">
        <div class="card-navi">
          <a href="index.html">Home</a>
          <a href="server.html">Server</a>
          <a href="log_data.html" class="active">Log Data</a>
        </div>

        <div class="main-panel">
          <div class="panel-heading">
            <div>
              <h5>SPOT Interface Batch</h5>
              <p id="statusText">Loading latest submission…</p>
            </div>
            <button class="btn-refresh" id="refreshBtn" onclick="fetchData()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              Refresh
            </button>
          </div>

          <div id="content"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7UloeZb2pIGS6TvyC1mlvgHk3m7BnrOCrvkS6c8RWj8lIR4R9CyboAKV4ruVvD-NsGg/exec?sheet=spot';

    // Groups mirror the original SPOT form's three sections.
    // Each entry: [row index, label]
    const GROUPS = [
      {
        title: '01 – SPOT Interface Batch Programs',
        fields: [
          [1, '01 – Invoice Interface'],
          [2, '02 – Receipt Interface'],
          [3, '03 – Customer Interface']
        ]
      },
      {
        title: '02 – SPOT General Batch Programs',
        fields: [
          [4, '03 – Generate Daily Timetable'],
          [5, '06 – Calculate Demurage'],
          [6, '07 – Populate Commuter Train']
        ]
      },
      {
        title: '03 – SPOT Report Batch Programs',
        fields: [
          [7, '03 – Revenue per Net Ton KM (Freight Train)'],
          [8, '04 – Net Ton, Ton-KM by Commodity (Freight Train)'],
          [9, '06 – Revenue for Freight Train'],
          [10, '07 – Periodical Freight Stats'],
          [11, '08 – Punctuality Data'],
          [12, '09 – Locomotive Statistic'],
          [13, '11 – Train Equipment Tracking'],
          [14, '13 – Turnaround Statistic']
        ]
      }
    ];

    const contentEl = document.getElementById('content');
    const statusEl = document.getElementById('statusText');
    const refreshBtn = document.getElementById('refreshBtn');

    function renderLoading() {
      contentEl.innerHTML = `
        <div class="skeleton">
          <div class="skel-line" style="width:40%"></div>
          <div class="skel-line" style="width:75%"></div>
          <div class="skel-line" style="width:60%"></div>
          <div class="skel-line" style="width:68%"></div>
          <div class="skel-line" style="width:55%"></div>
          <div class="skel-line" style="width:70%"></div>
        </div>`;
      statusEl.textContent = 'Loading latest submission…';
    }

    function renderError(message) {
      contentEl.innerHTML = `
        <div class="error-box">
          <div class="error-icon">✕</div>
          <p>${message}</p>
          <button class="btn-retry-inline" onclick="fetchData()">Try again</button>
        </div>`;
      statusEl.textContent = 'Failed to load data';
    }

    function renderEmpty() {
      contentEl.innerHTML = `
        <div class="error-box neutral">
          <p>No submissions found yet.</p>
        </div>`;
      statusEl.textContent = 'No data';
    }

    function formatDate(rawDate) {
      const d = new Date(rawDate);
      if (isNaN(d.getTime())) return String(rawDate);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function renderLatest(row) {
      const formattedDate = formatDate(row[0]);
      const staff = row[15] ? `Created by ${row[15]}` : '';

      const groupsHtml = GROUPS.map(group => {
        const rowsHtml = group.fields.map(([idx, label]) => {
          const value = row[idx];
          const hasValue = value !== undefined && value !== null && String(value).trim() !== '';
          return `
            <div class="field-row">
              <div class="field-label">${label}</div>
              <div class="field-value ${hasValue ? '' : 'empty'}">${hasValue ? value : '—'}</div>
            </div>`;
        }).join('');
        return `<div class="group-title">${group.title}</div>${rowsHtml}`;
      }).join('');

      contentEl.innerHTML = `
        <div class="report-card">
          <div class="report-card-top">
            <span class="report-date">${formattedDate}</span>
            <span class="badge-latest">Latest</span>
          </div>
          <div class="report-card-body">
            ${groupsHtml}
          </div>
        </div>`;

      statusEl.textContent = staff ? `Showing the most recent submission · ${staff}` : 'Showing the most recent submission';
    }

    async function fetchData() {
      renderLoading();
      refreshBtn.disabled = true;
      refreshBtn.classList.add('spinning');

      try {
        const response = await fetch(SCRIPT_URL);
        if (!response.ok) {
          throw new Error('Server responded with status ' + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          renderEmpty();
          return;
        }

        // Skip header row if the first cell isn't a parseable date
        const rows = data.filter(row => !isNaN(new Date(row[0]).getTime()));
        if (rows.length === 0) {
          renderEmpty();
          return;
        }

        const sorted = rows.slice().sort((a, b) => new Date(b[0]) - new Date(a[0]));
        renderLatest(sorted[0]);

      } catch (err) {
        console.error(err);
        renderError('Could not load the latest data. Please check your connection and try again.');
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.classList.remove('spinning');
      }
    }

    fetchData();
  </script>
</body>
</html>
